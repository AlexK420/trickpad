name: Build Trickpad

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Download source
        uses: actions/checkout@v4
      - name: Build application
        run: ./scripts/build.sh
      - name: Verify and package application
        run: |
          codesign --verify --deep --strict build/Trickpad.app
          lipo -archs build/Trickpad.app/Contents/MacOS/Trickpad
          ditto -c -k --sequesterRsrc --keepParent build/Trickpad.app "$RUNNER_TEMP/Trickpad.zip"
      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: Trickpad-macOS
          path: ${{ runner.temp }}/Trickpad.zip
          retention-days: 30
